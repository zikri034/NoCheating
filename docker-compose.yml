version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: safeexam_db
    restart: always
    environment:
      POSTGRES_USER: safeexam
      POSTGRES_PASSWORD: change_me
      POSTGRES_DB: safeexam
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safeexam"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./server
    container_name: safeexam_api
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=postgres://safeexam:change_me@db:5432/safeexam
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
