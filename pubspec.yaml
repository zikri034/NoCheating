name: thereisnocheating
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.1

dependencies:
  cached_network_image: ^4.0.4
  cryptography: ^2.9.0
  dio: ^5.11.1
  file_picker: ^13.0.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.2
  flutter_map: ^8.3.2
  flutter_secure_storage: ^11.2.0
  geolocator: ^14.1.1
  go_router: ^18.0.2
  image_picker: ^1.2.4
  intl: ^0.20.3
  latlong2: ^0.10.1
  local_auth: ^3.0.2
  path: ^1.9.1
  provider: ^6.1.5+1
  qr_flutter: ^4.1.0
  sensors_plus: ^7.1.1
  sqflite: ^2.4.4+2
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/safeexamlogo.jpg"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/safeexamlogo.jpg"
  windows:
    generate: true
    image_path: "assets/safeexamlogo.jpg"
